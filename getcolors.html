<!DOCTYPE html>
<html>
<body>
<img id='img' src='logo-hd2.png' onload='process()'>
<div id='res' style="font-size: 24px;">Processing...</div>
<script>
function process(){
    try {
        const img = document.getElementById('img');
        const cvs = document.createElement('canvas');
        cvs.width = img.width;
        cvs.height = img.height;
        const ctx = cvs.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0);
        const data = ctx.getImageData(0, 0, img.width, img.height).data;
        const counts = {};
        for(let i = 0; i < data.length; i += 4){
            if(data[i+3] < 128) continue; // skip transparent
            const r = Math.round(data[i]/10)*10;
            const g = Math.round(data[i+1]/10)*10;
            const b = Math.round(data[i+2]/10)*10;
            // format as hex roughly
            const hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
            const key = hex;
            counts[key] = (counts[key] || 0) + 1;
        }
        const sorted = Object.keys(counts).sort((a,b) => counts[b] - counts[a]);
        // filter out greyscale and near-white/black
        const filtered = sorted.filter(hex => {
            const r = parseInt(hex.slice(1,3), 16);
            const g = parseInt(hex.slice(3,5), 16);
            const b = parseInt(hex.slice(5,7), 16);
            const max = Math.max(r,g,b);
            const min = Math.min(r,g,b);
            // Ignore near white/black/grey
            if (max - min < 20) return false;
            if (max < 30 || min > 220) return false;
            return true;
        });
        document.getElementById('res').innerText = "TOP COLORS: " + sorted.slice(0, 10).join(', ') + " | NON-GREY: " + filtered.slice(0, 5).join(', ');
    } catch (e) {
        document.getElementById('res').innerText = "ERROR: " + e.message;
    }
}
</script>
</body>
</html>
